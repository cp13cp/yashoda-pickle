# Netlify Configuration for Yashoda Pickle Frontend

[build]
  command = "npm run build"
  publish = "dist"
  node_version = "18.17.0"

[build.environment]
  VITE_API_BASE_URL = "https://yashoda-pickle-backend-xxxx.onrender.com"
  VITE_SUPABASE_URL = "https://ehocckmjsdsxdcdkgrgk.supabase.co"
  VITE_SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVob2Nja21qc2RzeGRjZGtncmdrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY3MDU0NjksImV4cCI6MjA5MjI4MTQ2OX0.JsxWHvTHyZ_BaLSPMa7gXNsiit0gqi_JYR64qwe_ayQ"

# SPA (Single Page Application) configuration
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# Cache policy
[[headers]]
  for = "/dist/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# Performance hints
[context.production]
  command = "npm run build"
  environment = { VITE_NODE_ENV = "production" }
