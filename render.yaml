services:
  - type: web
    name: yashoda-pickle-backend
    env: docker
    dockerfilePath: ./server/Dockerfile
    region: singapore
    plan: standard
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: FRONTEND_URL
        fromService:
          type: static_site
          name: yashoda-pickle-frontend
          envKey: RENDER_EXTERNAL_URL
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: ADMIN_EMAIL
        sync: false
    healthCheckPath: /health
    buildCommand: npm install
    startCommand: npm start
